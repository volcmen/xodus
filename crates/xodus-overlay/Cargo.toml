[package]
name = "xodus-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
xodus = { path = "../xodus" }
tokio = { workspace = true }
thiserror = "2.0.18"
sdl3 = { version = "0.18.4", features = ["use-pkg-config"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }

[dev-dependencies]
tempfile = "3.27.0"
