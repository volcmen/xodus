[workspace]
resolver = "3"
members = ["crates/*", "vendor/xal", "vendor/glib-0.18"]
default-members = ["crates/*"]

[workspace.dependencies]
chrono = "0.4.42"
reqwest = { version = "0.13.4", features = ["json", "stream", "query"] }
tokio = { version = "1", features = ["full"] }
base64 = { version = "0.22.1" }
url = "2.5.8"

[patch.crates-io]
glib018 = { package = "glib", path = "vendor/glib-0.18" }
ntfs = { git = "https://github.com/xodus-gaming/ntfs.git" }

# xal with `RequestSigner::with_keypair` / `XalAuthenticator::set_request_signer`, so
# this service can mint XSTS tokens bound to a proof key the CALLER holds. Without it
# the caller cannot sign requests carrying a token minted here, and every signed Xbox
# Live call goes out unsigned. Branched from the rev the git dependency already pins.
[patch."https://github.com/xodus-gaming/xal-rs"]
xal = { path = "vendor/xal" }
